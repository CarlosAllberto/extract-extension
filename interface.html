<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Extract</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="global.css">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background:
        linear-gradient(rgba(0, 0, 0, .58), rgba(0, 0, 0, .58)),
        url("background.webp") center / cover no-repeat,
        var(--background);
      color: var(--foreground);
      font: 200 15px/1.5 var(--font-sans);
    }

    .wrap {
      max-width: 880px;
      margin: 44px auto;
      padding: 0 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 200;
      color: var(--color-muted);
      padding: 6px 12px;
      border: 1px solid var(--color-border-subtle);
      background: var(--color-surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-border);
    }

    .dot.ok {
      background: #fff;
    }

    .dot.err {
      background: var(--color-danger);
    }

    .field {
      flex: 1;
      min-width: 260px;
      margin-bottom: 24px;
    }

    .actions-row {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      flex-wrap: wrap;
    }

    .footer {
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--color-muted);
      font-size: 12px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .kbd {
      font-size: 12px;
      padding: 2px 6px;
      border: 1px solid var(--color-border-subtle);
      color: var(--color-muted);
    }

    .tips {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--color-muted);
      font-size: 12px;
      margin-top: 10px;
      font-weight: 200;
    }

    .logo-top {
      display: flex;
      justify-content: center;
      margin-bottom: 50px;
    }

    .logo-top img {
      height: 72px;
    }

    .footer-info {
      text-align: center;
      margin-top: 40px;
      padding: 18px 12px;
      color: var(--color-muted);
      font-size: 13px;
      font-weight: 200;
      background: transparent;
      text-transform: uppercase;
    }

    .footer-info a {
      color: var(--foreground);
    }

    .footer-info a:hover {
      color: var(--color-muted);
      text-decoration: underline;
    }

    @media (max-width: 520px) {
      .card {
        min-width: auto;
      }

      .status {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="logo-top">
      <img src="logo.svg" alt="Logo" />
    </div>
    <div class="header">
      <div class="status" title="Webhook status">
        <span class="dot" id="webhookDot"></span>
        <span id="webhookStatus">Webhook not set</span>
      </div>
    </div>

    <div class="card">
      <div>
        <div class="field">
          <label for="termInput">Lead and location</label>
          <input id="termInput" type="text" placeholder="e.g., lawyer in NYC" autocomplete="off" />
          <div class="tips">Shortcut: <span class="kbd">Enter</span> to <strong>Extract</strong></div>
        </div>

        <div class="actions-row">
          <button id="editWebhookBtn" class="btn btn-ghost" title="Add webhook">
            <span>
              Add webhook
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                <path d="M12 6v12m6-6H6" stroke-width="1.6" />
              </svg>
            </span>
          </button>

          <button id="extractBtn" class="btn btn-primary" title="Open Google Maps and start extraction">
            <span>
              Extract
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                <path d="M3 12h13" stroke-width="1.6" />
                <path d="M12 5l7 7-7 7" stroke-width="1.6" />
              </svg>
            </span>
          </button>
        </div>

      </div>

      <div class="footer">
      </div>
    </div>
  </div>

  <div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal">
      <header>
        <h3>Configure Webhook</h3>
        <button class="close" id="closeModalBtn" aria-label="Close">x</button>
      </header>
      <div class="body">
        <label for="webhookInput">Webhook URL</label>
        <input id="webhookInput" class="modal-input" type="text" placeholder="https://your-domain.com/webhook/receive">
        <div class="hint">
          The URL is saved in <code>localStorage</code> (and <code>chrome.storage.local</code> for the content script).
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-ghost" id="cancelModalBtn"><span>Cancel</span></button>
        <button class="btn btn-primary" id="saveWebhookBtn"><span>Save</span></button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="interface.js"></script>
</body>

<footer class="footer-info">
  <p>Software by <a href="https://treendz.com.br" target="_blank" rel="noopener noreferrer">Treendz</a></p>
</footer>

</html>
